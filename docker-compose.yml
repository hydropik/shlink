services:
    shlink_nginx:
        container_name: shlink_nginx
        image: nginx:1.25-alpine
        volumes:
            - ./:/home/shlink/www
            - ./docs:/home/shlink/www/public/docs
            - ./data/infra/vhost.conf:/etc/nginx/conf.d/default.conf
        links:
            - shlink_php
    shlink_php:
        container_name: shlink_php
        user: "${PHP_USER:-1000}:${PHP_GROUP:-1000}"
        build:
            context: .
            dockerfile: ./data/infra/php.Dockerfile
        volumes:
            - ./:/home/shlink/www
            - ./data/infra/php.ini:/usr/local/etc/php/php.ini
        links:
            - shlink_db_postgres
        environment:
            LC_ALL: C
            DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:8000}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
    shlink_db_postgres:
        container_name: shlink_db_postgres
        user: "${PG_USER:-1000}:${PG_GROUP:-1000}"
        image: postgres:16.3-alpine
        ports:
            - "${PG_PORT:-5434}:5432"
        volumes:
            - ./:/home/shlink/www
            - ./data/infra/database_pg:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-shlink}
            PGDATA: /var/lib/postgresql/data/pgdata
