services:
    shlink_nginx:
        container_name: shlink_nginx
        build:
            context: .
            dockerfile: ./data/infra/nginx.Dockerfile
        expose:
            - "80"
        depends_on:
            - shlink_php

    shlink_php:
        container_name: shlink_php
        user: "${PHP_USER:-1000}:${PHP_GROUP:-1000}"
        build:
            context: .
            dockerfile: ./data/infra/php.Dockerfile
        depends_on:
            - shlink_db_postgres
        environment:
            LC_ALL: C
            DEFAULT_DOMAIN: ${DEFAULT_DOMAIN}
            IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED:-true}
            DB_DRIVER: postgres
            DB_HOST: shlink_db_postgres
            DB_PORT: "5432"
            DB_NAME: ${POSTGRES_DB:-shlink}
            DB_USER: ${POSTGRES_USER:-postgres}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            INITIAL_API_KEY: ${INITIAL_API_KEY:-}
            GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    shlink_db_postgres:
        container_name: shlink_db_postgres
        image: postgres:16.3-alpine
        expose:
            - "5432"
        volumes:
            - shlink_pg_data:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-shlink}
            PGDATA: /var/lib/postgresql/data/pgdata

volumes:
    shlink_pg_data:
